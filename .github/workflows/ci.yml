name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Tests
        run: pytest
      - name: Retrieval regression
        working-directory: .
        run: python scripts/evaluate.py
      - name: Grounded RAG regression
        working-directory: .
        run: python scripts/evaluate_rag.py
      - name: Validate Milestone 7 evaluation suite
        working-directory: .
        run: python scripts/validate_m7_dataset.py
      - name: Build backend image
        working-directory: .
        run: docker build -t uae-government-ai-assistant-backend:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build frontend image
        working-directory: .
        run: docker build -t uae-government-ai-assistant-frontend:ci ./frontend
