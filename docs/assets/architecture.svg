<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .boxTitle { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 18px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .lane { font: 700 18px Arial, sans-serif; fill: #64748b; letter-spacing: 1px; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="800" y="64" text-anchor="middle" class="title">UAE Government AI Assistant — Production Architecture</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">Bilingual public-service RAG • Federal, Dubai and Abu Dhabi</text>

  <text x="70" y="160" class="lane">USER &amp; EDGE</text>
  <text x="70" y="360" class="lane">APPLICATION RUNTIME</text>
  <text x="70" y="650" class="lane">DATA &amp; MANAGED SERVICES</text>

  <rect x="120" y="190" rx="24" ry="24" width="320" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="238" text-anchor="middle" class="boxTitle">Browser</text>
  <text x="280" y="270" text-anchor="middle" class="boxText">Arabic RTL / English LTR</text>
  <text x="280" y="297" text-anchor="middle" class="small">Chat • citations • service explorer</text>

  <rect x="640" y="190" rx="24" ry="24" width="360" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="238" text-anchor="middle" class="boxTitle">Vercel</text>
  <text x="820" y="270" text-anchor="middle" class="boxText">Next.js / TypeScript</text>
  <text x="820" y="297" text-anchor="middle" class="small">Same-origin server-side API proxy</text>

  <path d="M440 255 L640 255" class="arrow"/>

  <rect x="590" y="400" rx="24" ry="24" width="460" height="170" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="448" text-anchor="middle" class="boxTitle">Google Cloud Run</text>
  <text x="820" y="480" text-anchor="middle" class="boxText">FastAPI / Python</text>
  <text x="820" y="510" text-anchor="middle" class="small">Hybrid retrieval • reranking • grounded RAG</text>
  <text x="820" y="537" text-anchor="middle" class="small">Caching • rate limits • telemetry • security</text>

  <path d="M820 320 L820 400" class="arrow"/>

  <rect x="110" y="690" rx="24" ry="24" width="400" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="738" text-anchor="middle" class="boxTitle">Neon PostgreSQL</text>
  <text x="310" y="770" text-anchor="middle" class="boxText">pgvector + lexical index</text>
  <text x="310" y="800" text-anchor="middle" class="small">Documents • chunks • services • embeddings</text>

  <rect x="590" y="690" rx="24" ry="24" width="360" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="738" text-anchor="middle" class="boxTitle">Upstash Redis</text>
  <text x="770" y="770" text-anchor="middle" class="boxText">TLS managed Redis</text>
  <text x="770" y="800" text-anchor="middle" class="small">Response cache • rate limiting</text>

  <rect x="1030" y="690" rx="24" ry="24" width="440" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1250" y="738" text-anchor="middle" class="boxTitle">Google Secret Manager</text>
  <text x="1250" y="770" text-anchor="middle" class="boxText">Runtime secrets</text>
  <text x="1250" y="800" text-anchor="middle" class="small">Database • Redis • ops token</text>

  <path d="M690 570 C610 620 470 655 390 690" class="arrow"/>
  <path d="M820 570 L790 690" class="arrow"/>
  <path d="M980 570 C1060 620 1170 650 1210 690" class="arrow dash"/>

  <rect x="1100" y="400" rx="24" ry="24" width="370" height="170" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1285" y="448" text-anchor="middle" class="boxTitle">Google Cloud Build</text>
  <text x="1285" y="480" text-anchor="middle" class="boxText">Artifact Registry</text>
  <text x="1285" y="510" text-anchor="middle" class="small">Container build + image storage</text>
  <text x="1285" y="537" text-anchor="middle" class="small">Cloud Run deployment image</text>

  <path d="M1100 485 L1050 485" class="arrow"/>

  <rect x="120" y="400" rx="24" ry="24" width="370" height="170" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="448" text-anchor="middle" class="boxTitle">Official UAE Sources</text>
  <text x="305" y="480" text-anchor="middle" class="boxText">12 enabled sources</text>
  <text x="305" y="510" text-anchor="middle" class="small">Federal • Dubai • Abu Dhabi</text>
  <text x="305" y="537" text-anchor="middle" class="small">HTML/PDF ingestion + provenance</text>

  <path d="M490 485 L590 485" class="arrow dash"/>
  <path d="M305 570 L305 690" class="arrow dash"/>

  <text x="800" y="920" text-anchor="middle" class="small">
    Independent portfolio/research project — not an official UAE government service.
  </text>
</svg>
